<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasanaa Appstore - Official Downloads</title>
    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: #0d0e15;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-green: #39ff14;
            --text-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            background-image: radial-gradient(circle at 50% 20%, #1a103c 0%, transparent 50%);
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
            animation: border-pulse 4s infinite alternate;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            animation: neon-blink 3s infinite alternate;
        }

        .version {
            color: var(--neon-magenta);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }

        /* Dynamic Button Container */
        #links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
            min-height: 50px; /* Forces visibility during engine render */
        }

        /* Base Link Button Styling */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-sizing: border-box;
        }

        /* Color Themes for Buttons */
        .btn-green {
            background: rgba(57, 255, 20, 0.1);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }
        .btn-green:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .btn-cyan {
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .btn-cyan:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .btn-magenta {
            background: rgba(255, 0, 127, 0.1);
            border: 2px solid var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }
        .btn-magenta:hover {
            background: var(--neon-magenta);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        .instructions {
            text-align: left;
            font-size: 0.95rem;
            background: #121320;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.1);
            line-height: 1.6;
            margin-top: 25px;
        }

        /* Neon Blinking & Pulsing Animations */
        @keyframes neon-blink {
            0%, 100% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
            45% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
            50% { text-shadow: none; color: #8b949e; }
            55% { text-shadow: 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta); color: #fff; }
            58% { text-shadow: none; }
            60% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
        }

        @keyframes border-pulse {
            0% { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            100% { border-color: var(--neon-magenta); box-shadow: 0 0 25px rgba(255, 0, 127, 0.3); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GASANAA APP STORE</h1>
    <div class="version">Only Android Apps</div>
    
    <!-- This container is where your links safely generate -->
    <div id="links-container"></div>
    
    <div class="instructions">
        <span style="color: var(--neon-cyan); font-weight: bold;">⚡ Installation Directive:</span>
        <ol style="margin: 10px 0 0 20px; padding: 0;">
            <li>Select an official portal link above.</li>
            <li>If installing via raw APK, permit "Unknown Sources" inside Android Settings browser security when prompted.</li>
        </ol>
    </div>
</div>

<script>
    // Make sure DOM elements are tracked instantly
    document.addEventListener("DOMContentLoaded", function() {
        
        // 🛠️ CONFIGURATION BLOCK: Edit your apps and URLs here
        const primaryApp = {
            text: "Download Neon Reflex Clicker APP",
            url: "Neon reflex clicker.apk",
            theme: "green",
            isDownload: true
        };

        const portfolioApps = [
            {
                text: "Neon Reflex Clicker (Amazon Appstore)",
                url: "https://www.amazon.in/dp/B0HJNV3VFH",
                theme: "cyan",
                isDownload: false
            },
            {
                text: "upcoming app",
                url: "SpaceTapTycoonBeta.apk",
                theme: "magenta",
                isDownload: true
            }
        ];

        const container = document.getElementById('links-container');
        if (!container) return;

        // Button generation factory engine
        function buildElement(data) {
            const btn = document.createElement('a');
            btn.href = data.url;
            btn.innerText = data.text;
            btn.className = `btn btn-${data.theme}`;
            if (data.isDownload) {
                btn.setAttribute('download', '');
            } else {
                btn.setAttribute('target', '_blank');
            }
            return btn;
        }

        // 1. Inject Featured Main App Button
        if (primaryApp) {
            container.appendChild(buildElement(primaryApp));
        }

        // 2. Inject Additional Apps Portfolio Section
        if (portfolioApps && portfolioApps.length > 0) {
            const sectionDivider = document.createElement('div');
            sectionDivider.innerHTML = `
                <hr style="border: 0; border-top: 1px dashed var(--neon-cyan); margin: 35px 0 20px 0; opacity: 0.5;">
                <p style="color: #fff; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 0 5px var(--neon-magenta);">
                    📡 More Applications Showcase
                </p>
            `;
            container.appendChild(sectionDivider);

            portfolioApps.forEach(app => {
                container.appendChild(buildElement(app));
            });
        }
    });
</script>

</body>
</html>
